<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VFR Funktrainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Schriften lokal eingebunden (SIL Open Font License, siehe fonts/) */
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400 900;font-display:swap;src:url("fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* DESIGN ANPASSEN: Alle Farben und Schriften sind hier zentral als Variablen definiert (hell, darunter zweimal dunkel).
   Layout: schmale App-Spalte, oben Navigation mit Rufzeichen-Chip; Szenario als Funkprotokoll links, Lagekarte rechts */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EBEEF3; --fg:#111821; --muted:#5A6573; --line:#DFE4EB;
  --accent:#2B47C9; --accent-fg:#FFFFFF; --accent-soft:#E9EDFB;
  --air:#B4236A; --ok:#1C8456; --ok-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FBE9E7;
  --f-ui:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-radio:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px;
  --hill-1:#E6EAF0; --hill-2:#D9DFE8; --hill-3:#CBD3DE;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1116; --surface:#151A21; --sunk:#1B212A; --fg:#E6EAF0; --muted:#97A2B0; --line:#262E39;
  --accent:#8099FF; --accent-fg:#0D1116; --accent-soft:#1B2343;
  --air:#E0629F; --ok:#4CC38A; --ok-soft:#14291F; --bad:#F2877B; --bad-soft:#2E1714; color-scheme:dark;
  --hill-1:#171C23; --hill-2:#1D232C; --hill-3:#242B35;
}}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#151A21; --sunk:#1B212A; --fg:#E6EAF0; --muted:#97A2B0; --line:#262E39;
  --accent:#8099FF; --accent-fg:#0D1116; --accent-soft:#1B2343;
  --air:#E0629F; --ok:#4CC38A; --ok-soft:#14291F; --bad:#F2877B; --bad-soft:#2E1714; color-scheme:dark;
  --hill-1:#171C23; --hill-2:#1D232C; --hill-3:#242B35;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
nav.main{display:flex;gap:4px;margin-right:auto}
nav.main a{text-decoration:none;color:var(--muted);font-weight:500;padding:6px 12px;border-radius:999px;font-size:15px}
nav.main a:hover{color:var(--fg)}
nav.main a[aria-current="page"]{color:var(--fg);background:var(--sunk)}
.cs-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:5px 6px 5px 12px;border-radius:999px;cursor:pointer;font-family:var(--f-radio);font-size:14px;font-weight:600}
.cs-chip span.edit{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);background:var(--sunk);padding:2px 8px;border-radius:999px}
@media (max-width:640px){
  .top .wrap{height:auto;flex-wrap:wrap;padding-block:10px;gap:10px}
  nav.main{order:3;width:100%;margin-right:0}
  .cs-chip{margin-left:auto}
}

main{padding-block:40px 64px}
h1,h2,h3{text-wrap:balance;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(30px,5vw,44px);line-height:1.1;font-weight:700}
h2{font-size:24px;line-height:1.2;font-weight:700}
h3{font-size:18px;line-height:1.3;font-weight:600}
p{margin:0}
.lead{color:var(--muted);font-size:18px;max-width:60ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column}
.mono{font-family:var(--f-radio)}

/* Start */
.hero{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.hero-in{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:start;padding:40px 40px 230px}
.hero-in > *{min-width:0}
.hero h1{font-size:clamp(28px,4vw,38px);line-height:1.12}
.hero .lead{font-size:17px}
@media (max-width:820px){.hero-in{grid-template-columns:minmax(0,1fr);gap:24px;padding:28px 20px 210px}}
.hero .cs-card{background:var(--bg)}
/* Hintergrund-Animation: ruhige Bergketten, die langsam vorbeiziehen, davor eine Cessna */
.scene{position:absolute;inset:auto 0 0 0;height:240px;z-index:1;pointer-events:none}
.layer{position:absolute;left:0;bottom:0;width:200%;animation:slide linear infinite}
.layer svg{display:block;width:100%;height:100%}
.l-3{height:150px;animation-duration:240s}
.l-2{height:108px;animation-duration:150s}
.l-1{height:62px;animation-duration:90s;z-index:2}
@keyframes slide{to{transform:translateX(-50%)}}
.flyer{position:absolute;right:14%;bottom:96px;z-index:1;animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.cessna{width:150px;height:auto;display:block}
.cessna .prop{transform-origin:150px 31px;animation:prop .14s linear infinite}
@keyframes prop{50%{transform:scaleY(.2)}}
.say{position:absolute;right:112px;bottom:52px;width:max-content;max-width:280px;font-family:var(--f-radio);font-size:13px;line-height:1.45;padding:8px 12px;border-radius:10px;border-bottom-right-radius:3px;background:var(--bg);color:var(--fg);border:1px solid var(--line);box-shadow:0 2px 8px color-mix(in srgb,var(--fg) 8%,transparent);transition:opacity .35s ease}
.say.out{opacity:0}
.say .cs{white-space:nowrap}
@media (max-width:820px){.flyer{right:12px;bottom:80px}.cessna{width:120px}.say{right:84px;max-width:min(230px,58vw)}}
@media (prefers-reduced-motion:reduce){.layer,.flyer,.cessna .prop{animation:none}}
.cs-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.cs-card label{font-weight:600;font-size:15px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font-family:var(--f-radio);font-size:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:10px;padding:10px 18px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:14px;color:var(--muted)}
.cs-preview{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.cs-preview b{font-family:var(--f-radio);color:var(--fg);font-weight:600}
.err{color:var(--bad);font-size:14px}

.strands{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:40px}
@media (max-width:720px){.strands{grid-template-columns:1fr}}
.strand{display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .15s, transform .15s}
.strand:hover{border-color:var(--accent);transform:translateY(-2px)}
.strand .icon{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.strand p{color:var(--muted)}
.strand .go{margin-top:auto;font-weight:600;color:var(--accent);font-size:15px}

/* Listen */
.pagehead{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.module{border-top:1px solid var(--line);padding-block:22px;display:grid;grid-template-columns:200px 1fr;gap:24px}
@media (max-width:720px){.module{grid-template-columns:1fr;gap:12px}}
.module .mh{display:flex;flex-direction:column;gap:4px}
.module .mh .eyebrow{font-family:var(--f-radio);letter-spacing:.04em}
.lessons{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-width:0}
a.row:hover{border-color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t div:first-child{font-weight:600}
.row .t div+div{font-size:14px;color:var(--muted)}
.row.soon{background:transparent;border-style:dashed}
.row.soon .t div:first-child{color:var(--muted);font-weight:500}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.new{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.sc{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;min-height:180px}
a.sc:hover{border-color:var(--accent)}
.sc.soon{background:transparent;border-style:dashed}
.sc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.sc p{color:var(--muted);font-size:15px}
.sc .space{font-family:var(--f-radio);font-size:12px;font-weight:600;color:var(--air);letter-spacing:.04em}

/* Szenario */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:15px;margin-bottom:16px}
.back:hover{color:var(--fg)}
.sc-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:900px){.sc-layout{grid-template-columns:1fr}.side{order:-1}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.map svg{width:100%;height:auto;display:block}
.map .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.map .legend i{display:inline-block;width:14px;height:0;border-top:2px dashed var(--air);vertical-align:middle;margin-right:6px}
.phases{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.phase{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);padding:4px 0}
.phase .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.phase.done{color:var(--fg)} .phase.done .dot{background:var(--ok)}
.phase.now{color:var(--fg);font-weight:600} .phase.now .dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.toggle + .toggle{border-top:1px solid var(--line)}
.toggle small{display:block;color:var(--muted);font-size:13px}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.freq{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--sunk);margin-bottom:20px;flex-wrap:wrap}
.freq .station{font-weight:600}
.freq .mhz{font-family:var(--f-radio);font-size:15px;color:var(--muted)}

.log{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:88%;animation:in .25s ease-out}
.msg.T{align-self:flex-start}
.msg.P{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg.P .who{color:var(--accent)}
.bubble{font-family:var(--f-radio);font-size:15.5px;line-height:1.6;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.T .bubble{border-top-left-radius:4px}
.msg.P .bubble{background:var(--accent-soft);border-color:transparent;border-top-right-radius:4px}
.cs{font-weight:600;color:var(--accent)}
.msg.T .cs{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
.why{font-size:14px;color:var(--muted);max-width:60ch;line-height:1.5}
.msg.P .why{text-align:right}
.why b{color:var(--fg);font-weight:600}
.info{align-self:stretch;font-size:15px;color:var(--fg);padding:14px 16px;border-left:2px solid var(--line);margin-block:6px;animation:in .25s ease-out}
.info .eyebrow{display:block;margin-bottom:4px}
.info p{color:var(--muted)}
.hidden-msg .bubble{background:transparent;border:1.5px dashed var(--accent);color:var(--muted);font-family:var(--f-ui);display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right}
.hidden-msg .bubble strong{color:var(--fg);font-size:15px}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg,.info{animation:none}.strand{transition:none}}

.controls{position:sticky;bottom:0;margin-top:28px;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;align-items:center;gap:10px}
.controls .count{margin-right:auto;font-family:var(--f-radio);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.done-card{align-self:stretch;margin-top:10px;padding:20px;border-radius:var(--r);background:var(--ok-soft);display:flex;flex-direction:column;gap:10px}
.done-card h3{color:var(--ok)}
.done-card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* Lektion */
.lesson{max-width:720px;display:flex;flex-direction:column;gap:28px}
.lesson section{display:flex;flex-direction:column;gap:12px}
.lesson section p{max-width:65ch}
.spell{display:flex;gap:8px;flex-wrap:wrap}
.spell .ch{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:64px}
.spell .ch b{font-family:var(--f-radio);font-size:22px}
.spell .ch span{font-size:13px;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.compare{grid-template-columns:1fr}}
.compare div{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.compare .big{font-family:var(--f-radio);font-size:26px;font-weight:600;color:var(--accent)}
.compare small{color:var(--muted);font-size:14px}
.quiz{display:flex;flex-direction:column;gap:20px}
.q{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.q .opts{display:flex;flex-direction:column;gap:8px}
.q .opts button{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.q .opts button:hover:not(:disabled){border-color:var(--accent)}
.q .opts button:disabled{cursor:default}
.q .opts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.q .opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.q .fb{font-size:14px;color:var(--muted)}
.q .mono-o{font-family:var(--f-radio);font-weight:600}

footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
footer .wrap > span{max-width:70ch}
footer nav{display:flex;gap:16px}
footer nav a{color:var(--muted);text-decoration:none;font-weight:500}
footer nav a:hover{color:var(--fg);text-decoration:underline}

/* Rechtliches */
.legal{max-width:720px;display:flex;flex-direction:column;gap:28px}
.legal section{display:flex;flex-direction:column;gap:10px}
.legal h2{font-size:20px}
.legal p,.legal li{max-width:68ch;color:var(--fg)}
.legal ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.legal address{font-style:normal;line-height:1.6}
.legal a{color:var(--accent);text-underline-offset:2px}
.legal .stand{color:var(--muted);font-size:14px}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <a class="brand" href="#start" aria-label="VFR Funktrainer, Startseite">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 5v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 9.5a6 6 0 0 0 0 7M17.5 9.5a6 6 0 0 1 0 7" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="15.5" r="1.8" fill="var(--accent)"/></svg>
      VFR Funktrainer
    </a>
    <nav class="main" aria-label="Hauptnavigation">
      <a href="#start" data-nav="start">Start</a>
      <a href="#kurs" data-nav="kurs">Kurs</a>

<script>
/* ---------- Rufzeichen ---------- */
const ICAO={A:"Alfa",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",G:"Golf",H:"Hotel",I:"India",J:"Juliett",K:"Kilo",L:"Lima",M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",R:"Romeo",S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whiskey",X:"X-ray",Y:"Yankee",Z:"Zulu","0":"Null","1":"Eins","2":"Zwo","3":"Drei","4":"Vier","5":"Fünf","6":"Sechs","7":"Sieben","8":"Acht","9":"Neun"};
const store={get(k,d){try{const v=localStorage.getItem("vfrft:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("vfrft:"+k,JSON.stringify(v))}catch(e){}}};

function normalizeCS(raw){
  let s=(raw||"").toUpperCase().replace(/[^A-Z0-9-]/g,"");
  if(!s.includes("-") && /^D[A-Z]{4}$/.test(s)) s="D-"+s.slice(1);
  return s;
}
function validCS(s){return /^[A-Z0-9]{1,2}-[A-Z0-9]{3,5}$/.test(s)}
function shortCS(s){const [p,r]=s.split("-");return p+"-"+r.slice(-2)}
function spellCS(s){return s.replace("-","").split("").map(c=>ICAO[c]||c).join(" ")}

let CS=store.get("cs","D-EABC"); if(!validCS(CS)) CS="D-EABC";
const prefs={practice:store.get("practice",false),spelled:store.get("spelled",false)};
const done=store.get("done",{});

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fill(text,opts={}){
  const full=prefs.spelled&&opts.radio?spellCS(CS):CS;
  const sh=prefs.spelled&&opts.radio?spellCS(shortCS(CS)):shortCS(CS);
  return esc(text).replace(/&lt;(\/?)b&gt;/g,"<$1b>").replace(/\{CS\}/g,`<span class="cs">${esc(full)}</span>`).replace(/\{CSK\}/g,`<span class="cs">${esc(sh)}</span>`);
}
function setChip(){document.getElementById("csChipText").textContent=CS}

/* ---------- Inhalte ---------- */
const MODULES=[
  {n:"Modul 1",t:"Grundlagen",d:"Rufzeichen, Alphabet und der Aufbau einer Meldung",lessons:[
    {id:"rufzeichen",t:"Dein Rufzeichen",d:"Vollständig, abgekürzt und wann du was verwendest",min:6},
    {t:"Das Buchstabieralphabet und Zahlen",soon:true},
    {t:"Aufbau einer Funkmeldung",soon:true},
    {t:"Rücklesepflichtige Angaben",soon:true}]},
  {n:"Modul 2",t:"Unkontrollierte Flugplätze",d:"Rollen, Start, Platzrunde und Landung mit dem Flugleiter",lessons:[
    {t:"Rollinformation und Abflug",soon:true},{t:"Platzrundenmeldungen",soon:true}]},
  {n:"Modul 3",t:"Kontrollierte Flugplätze",d:"Freigaben, Meldepunkte und Kontrollzonen",lessons:[
    {t:"Freigaben verstehen",soon:true},{t:"An- und Abflug über Pflichtmeldepunkte",soon:true}]},
  {n:"Modul 4",t:"Lufträume und FIS",d:"Fluginformationsdienst, TMZ und RMZ",lessons:[
    {t:"Mit FIS unterwegs",soon:true},{t:"TMZ und RMZ",soon:true}]},

];

const SCENARIOS=[

/* Positionen auf der Karte */
const POS={start:[98,8],n:[112,38],mid:[131,77],apt:[150,115],s:[188,192],out:[196,222]};
const ROUTE=["start","n","mid","apt","s","out"];
function heading(k){
  const i=ROUTE.indexOf(k);const a=POS[ROUTE[Math.min(i,ROUTE.length-2)]],b=POS[ROUTE[Math.min(i,ROUTE.length-2)+1]];
  return Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;
}

const CTR={

  steps:[
    {k:"info",ph:0,pos:"start",title:"Ausgangslage",text:"Du fliegst VFR mit einer Cessna 172 von Würzburg-Schenkenturm nach Ansbach. Der direkte Weg führt durch die Kontrollzone Nürnberg (Luftraum D). Der Einflug erfolgt über den Pflichtmeldepunkt NOVEMBER nördlich der Kontrollzone. Etwa 5 NM vor NOVEMBER hast du die ATIS gehört: Information Kilo, Piste 28, QNH 1017. Jetzt rastest du die Turmfrequenz."},
    {k:"P",ph:1,pos:"start",text:"Nürnberg Turm, {CS}",hint:"Erstanruf",why:"<b>Erstanruf:</b> zuerst die gerufene Stelle, dann dein vollständiges Rufzeichen. Bei viel Betrieb rufst du kurz an und wartest auf die Antwort."},

    {k:"T",ph:2,pos:"start",text:"{CSK}, Durchflug der Kontrollzone über NOVEMBER, Platz, SIERRA genehmigt, 3000 Fuß oder darunter, QNH 1017, Squawk 4621",why:"<b>Die Freigabe.</b> Ab hier verwendet der Lotse dein abgekürztes Rufzeichen. Erst jetzt darfst du es ebenfalls benutzen."},
    {k:"P",ph:2,pos:"start",text:"Durchflug über NOVEMBER, Platz, SIERRA genehmigt, 3000 Fuß oder darunter, QNH 1017, Squawk 4621, {CSK}",hint:"Rücklesung der Freigabe",why:"<b>Rücklesung:</b> Strecke, Höhe, QNH und Transpondercode liest du immer zurück. Das Rufzeichen steht bei der Rücklesung am Ende."},
    {k:"T",ph:2,pos:"start",text:"{CSK}, Rücklesung korrekt, melden Sie NOVEMBER",why:"„Rücklesung korrekt“ bestätigt, dass die Freigabe richtig angekommen ist. Dazu kommt eine Meldeaufforderung."},
    {k:"P",ph:2,pos:"start",text:"Wilco, {CSK}",hint:"Meldeaufforderung bestätigen",why:"<b>Wilco</b> heißt: verstanden und wird ausgeführt. „Roger Wilco“ wäre doppelt gemoppelt."},
    {k:"info",ph:3,pos:"n",title:"Unterwegs",text:"Du rastest Squawk 4621, stellst QNH 1017 ein und hältst 3000 Fuß. Kurz darauf überfliegst du NOVEMBER und fliegst in die Kontrollzone ein."},
    {k:"P",ph:3,pos:"n",text:"{CSK}, NOVEMBER, 3000 Fuß",hint:"Positionsmeldung",why:"<b>Positionsmeldung:</b> Rufzeichen, Position, Höhe. Mehr braucht es nicht."},
    {k:"T",ph:4,pos:"mid",text:"{CSK}, Verkehrsinformation, Airbus A320 im Endanflug Piste 28, 6 Meilen östlich des Platzes. Platzüberflug genehmigt, melden Sie SIERRA",why:"Im Luftraum D werden VFR-Flüge nicht gegen IFR-Verkehr gestaffelt, sie bekommen <b>Verkehrsinformationen</b>. Halte Ausschau und gib Bescheid, sobald du den Verkehr siehst."},
    {k:"P",ph:4,pos:"mid",text:"Verkehr in Sicht, Platzüberflug genehmigt, melde SIERRA, {CSK}",hint:"Verkehr und Anweisung bestätigen",why:"Mit „Verkehr in Sicht“ weiß der Lotse, dass du selbst Abstand halten kannst. Die Anweisung bestätigst du kurz."},
    {k:"info",ph:5,pos:"s",title:"Am Südrand",text:"Du überfliegst den Platz, der Airbus landet hinter dir. Du verlässt die Kontrollzone nach Süden und erreichst kurz darauf den Meldepunkt SIERRA."},
    {k:"P",ph:5,pos:"s",text:"{CSK}, SIERRA, 3000 Fuß, erbitte Frequenzwechsel",hint:"Meldepunkt und Wunsch",why:"Melde den Punkt und sag gleich, was du als Nächstes möchtest. Ohne Genehmigung verlässt du die Frequenz nicht."},
    {k:"T",ph:5,pos:"out",text:"{CSK}, Squawk 7000, Frequenzwechsel genehmigt, auf Wiederhören",why:"<b>7000</b> ist der Standardcode für VFR-Flüge ohne zugewiesenen Code."},
    {k:"P",ph:5,pos:"out",text:"Squawk 7000, Frequenzwechsel, {CSK}, auf Wiederhören",hint:"Zurücklesen und verabschieden",why:"Den Transpondercode liest du auch hier zurück. Danach wechselst du die Frequenz."}
  ]
};

function ridge(h,waves,base,fill){
  const W=2400,P=1200;let d=`M0 ${h}`;
  for(let x=0;x<=W;x+=15){let y=base;for(const [n,a,ph] of waves)y+=a*Math.sin(2*Math.PI*n*x/P+ph);d+=` L${x} ${Math.max(2,h-y).toFixed(1)}`}
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none"><path d="${d} L${W} ${h}Z" fill="${fill}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
}

  <path d="M147 30 Q151 33 147 36" fill="var(--surface)"/>
  <ellipse class="prop" cx="150" cy="31" rx="1.2" ry="11" fill="var(--muted)" stroke="none" opacity=".6"/>
</svg>`;
function startSay(){
  clearInterval(heroTimer);
  const b=document.getElementById("say");if(!b)return;
  let i=0;const show=()=>{b.innerHTML=fill(PHRASES[i])};
  show();
  heroTimer=setInterval(()=>{
    if(!document.getElementById("say")){clearInterval(heroTimer);return}
    b.classList.add("out");
    setTimeout(()=>{i=(i+1)%PHRASES.length;show();b.classList.remove("out")},380);
  },3800);
}

  app.innerHTML=`

  <div class="pagehead" style="margin-bottom:24px"><span class="eyebrow" style="color:var(--air)">Luftraum D (CTR) · Mittel</span><h1>Durchflug einer Kontrollzone</h1><p class="lead">Von Würzburg-Schenkenturm nach Ansbach, quer durch die Kontrollzone Nürnberg.</p></div>
  <div class="sc-layout">
    <div class="stack" style="min-width:0">
      <div class="freq"><span class="station">${CTR.station}</span><span class="mhz">${CTR.freq}</span></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="controls">
        <span class="count" id="count"></span>
        <button class="btn ghost" id="prev" type="button">Zurück</button>
        <button class="btn primary" id="next" type="button">Weiter</button>
      </div>
    </div>

      <div class="panel map" id="map"></div>

        <label class="toggle" for="tSpell"><span>Rufzeichen buchstabiert<small>So, wie du es sprichst</small></span><span class="switch"><input type="checkbox" id="tSpell" ${prefs.spelled?"checked":""}><span></span></span></label>

  document.getElementById("next").onclick=nextStep;

  document.getElementById("tPractice").onchange=e=>{prefs.practice=e.target.checked;store.set("practice",prefs.practice);sc.revealed=true;renderCTR()};
  document.getElementById("tSpell").onchange=e=>{prefs.spelled=e.target.checked;store.set("spelled",prefs.spelled);renderCTR()};
  renderCTR();
}

function needsReveal(){const s=CTR.steps[sc.i-1];return prefs.practice&&s&&s.k==="P"&&!sc.revealed}
function nextStep(){
  if(needsReveal()){sc.revealed=true;renderCTR(true);return}
  if(sc.i>=CTR.steps.length) return;
  sc.i++;sc.revealed=false;renderCTR(true);
}
function prevStep(){if(sc.i>1){sc.i--;sc.revealed=true;renderCTR()}}

function renderCTR(scroll){
  const log=document.getElementById("log");if(!log)return;
  const shown=CTR.steps.slice(0,sc.i);
  log.innerHTML=shown.map((s,idx)=>{
    const last=idx===shown.length-1;
    if(s.k==="info") return `<div class="info"><span class="eyebrow">${s.title}</span><p>${fill(s.text)}</p></div>`;
    const who=s.k==="P"?"Du":CTR.station;
    if(s.k==="P"&&last&&needsReveal()) return `<div class="msg P hidden-msg"><span class="who">Du</span><div class="bubble"><span>Was meldest du jetzt?</span><strong>${s.hint}</strong><button class="btn primary" type="button" id="reveal">Aufdecken</button></div></div>`;
    return `<div class="msg ${s.k}"><span class="who">${who}</span><div class="bubble">${fill(s.text,{radio:true})}</div><p class="why">${fill(s.why)}</p></div>`;
  }).join("");
  const finished=sc.i>=CTR.steps.length&&!needsReveal();
  if(finished){
    if(!done.ctr){done.ctr=true;store.set("done",done)}
    log.insertAdjacentHTML("beforeend",`<div class="done-card"><h3>Kontrollzone durchflogen</h3><p>Du hast den kompletten Funkverkehr durchgespielt. Probier das Szenario jetzt im Übungsmodus und überleg dir jede Meldung selbst, bevor du sie aufdeckst.</p><div class="acts"><button class="btn primary" type="button" id="again">${prefs.practice?"Noch einmal":"Im Übungsmodus wiederholen"}</button><a class="btn ghost" href="#beispiele">Weitere Beispiele</a></div></div>`);
    document.getElementById("again").onclick=()=>{if(!prefs.practice){prefs.practice=true;store.set("practice",true);document.getElementById("tPractice").checked=true}sc={i:1,revealed:false};renderCTR();window.scrollTo({top:0,behavior:"smooth"})};
  }
  const r=document.getElementById("reveal");if(r)r.onclick=nextStep;
  const cur=CTR.steps[sc.i-1];
  document.getElementById("map").innerHTML=mapSVG(cur.pos)+`<div class="legend"><span><i></i>Kontrollzone</span></div>`;
  document.getElementById("phases").innerHTML=CTR.phases.map((p,i)=>`<div class="phase ${finished||i<cur.ph?"done":i===cur.ph?"now":""}"><span class="dot"></span>${p}</div>`).join("");
  const total=CTR.steps.length;
  document.getElementById("count").textContent=`${String(sc.i).padStart(2,"0")} / ${total}`;
  document.getElementById("prev").disabled=sc.i<=1;
  const nb=document.getElementById("next");
  nb.disabled=finished; nb.textContent=needsReveal()?"Aufdecken":"Weiter";
  if(scroll){const el=log.lastElementChild;if(el&&el.getBoundingClientRect().bottom>window.innerHeight-90){el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"})}}
}

function viewRufzeichen(){
  const full=CS,sh=shortCS(CS);
  const chars=CS.replace("-","").split("");
  const qs=[
    {q:`Wie lautet das abgekürzte Rufzeichen von <span class="mono-o">${esc(full)}</span>?`,o:[sh,full.split("-")[0]+"-"+full.split("-")[1].slice(-3),full.split("-")[1].slice(-2)],a:0,fb:"Abgekürzt werden das erste Zeichen und mindestens die letzten beiden Buchstaben verwendet."},
    {q:"Ab wann darfst du dein abgekürztes Rufzeichen verwenden?",o:["Sobald die Bodenfunkstelle es selbst verwendet hat","Direkt nach deinem Erstanruf","Immer dann, wenn die Frequenz stark belegt ist"],a:0,fb:"Erst wenn die Bodenfunkstelle dich mit dem abgekürzten Rufzeichen angesprochen hat, darfst du es übernehmen."},
    {q:"Wo steht dein Rufzeichen bei einer Rücklesung?",o:["Am Ende der Rücklesung","Am Anfang der Rücklesung","Es entfällt bei Rücklesungen"],a:0,fb:"Bei der Rücklesung nennst du zuerst die Inhalte und am Ende dein Rufzeichen."}
  ];
  app.innerHTML=`
  <a class="back" href="#kurs">← Zum Kurs</a>
  <article class="lesson">
    <div class="pagehead" style="margin-bottom:0"><span class="eyebrow">Modul 1 · Lektion 1</span><h1>Dein Rufzeichen</h1><p class="lead">Dein Kennzeichen ist im Funk dein Name. So sprichst du es richtig, und so kürzt du es ab.</p></div>
    <section>
      <h2>So wird ${esc(full)} gesprochen</h2>
      <p>Jeder Buchstabe wird mit dem ICAO-Buchstabieralphabet gesprochen. Der Bindestrich wird nicht mitgesprochen.</p>
      <div class="spell">${chars.map(c=>`<div class="ch"><b>${esc(c)}</b><span>${esc(ICAO[c]||c)}</span></div>`).join("")}</div>
    </section>
    <section>
      <h2>Vollständig oder abgekürzt</h2>
      <div class="compare">
        <div><span class="eyebrow">Vollständig</span><span class="big">${esc(full)}</span><small>Beim Erstanruf und solange die Bodenfunkstelle es so verwendet.</small></div>
        <div><span class="eyebrow">Abgekürzt</span><span class="big">${esc(sh)}</span><small>Erst wenn die Bodenfunkstelle dich so angesprochen hat.</small></div>
      </div>
      <p>Die Abkürzung besteht aus dem ersten Zeichen und mindestens den letzten beiden Buchstaben. Gesprochen also <span class="mono-o">${esc(spellCS(sh))}</span>.</p>
    </section>
    <section>
      <h2>Kurzer Check</h2>
      <div class="quiz">${qs.map((q,i)=>`<div class="q" data-q="${i}"><h3>${q.q}</h3><div class="opts">${q.o.map((o,j)=>`<button type="button" data-o="${j}">${/^[A-Z0-9]+-/.test(o)||/^[A-Z]{2}$/.test(o)?`<span class="mono-o">${esc(o)}</span>`:esc(o)}</button>`).join("")}</div><p class="fb" hidden></p></div>`).join("")}</div>
    </section>
    <section id="lessonDone" hidden><div class="done-card"><h3>Lektion abgeschlossen</h3><p>Sieh dir an, wie dein Rufzeichen in einem echten Funkverkehr verwendet wird.</p><div class="acts"><a class="btn primary" href="#ctr">Zum Beispiel Kontrollzone</a><a class="btn ghost" href="#kurs">Zurück zum Kurs</a></div></div></section>
  </article>`;
  let answered=0;
  app.querySelectorAll(".q").forEach(el=>{
    const q=qs[+el.dataset.q];
    el.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{
      const j=+b.dataset.o;
      el.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;if(+x.dataset.o===q.a)x.classList.add("right")});
      if(j!==q.a)b.classList.add("wrong");
      const fb=el.querySelector(".fb");fb.hidden=false;fb.textContent=(j===q.a?"Richtig. ":"Nicht ganz. ")+q.fb;
      if(++answered===qs.length){done.rufzeichen=true;store.set("done",done);document.getElementById("lessonDone").hidden=false}
    }));
  });
}

}

});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("log")||e.target.closest("input,textarea"))return;
  if(e.key==="ArrowRight"){e.preventDefault();nextStep()}

});
